<!--
  Highcom Work wordmark for the first-run welcome window.

  PLACEHOLDER: the deployment has no vector wordmark yet, so this composes the
  shipped mark (apps/desktop/build-highcom/icon.png, embedded at 2x) with the
  product name set in the shell's brand typeface. Replace this file when design
  delivers the real lockup; the page consumes it as an <img>, so the asset must
  stay self-contained (no external font or stylesheet references).
-->
<svg width="240" height="40" viewBox="0 0 240 40" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  :root {
    --dsw-alias-label-primary: #0f1115;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --dsw-alias-label-primary: #f9fafb;
    }
  }
</style>
<image x="0" y="0" width="40" height="40" href="data:image/png;base64,"/>
<text x="52" y="29" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500" fill="var(--dsw-alias-label-primary)">Highcom Work</text>
</svg>